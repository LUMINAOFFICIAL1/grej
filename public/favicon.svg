<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#def141" />
      <stop offset="50%" stop-color="#f88cd4" />
      <stop offset="100%" stop-color="#5c31ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Base Background Box -->
  <rect width="64" height="64" rx="18" fill="#0d0e12" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#neonGrad)" stroke-width="2.5" opacity="0.8" />
  
  <!-- Cyber Shield Icon -->
  <path d="M32 10 L50 18 V33 C50 44 42 51 32 55 C22 51 14 44 14 33 V18 L32 10 Z" fill="#5c31ff" fill-opacity="0.25" stroke="url(#neonGrad)" stroke-width="3" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Central Checkmark / Spark -->
  <path d="M26 32 L30 36 L38 26" fill="none" stroke="#def141" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>
